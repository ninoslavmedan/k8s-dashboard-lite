apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-dashboard-lite
  namespace: k8s-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-dashboard-lite
  template:
    metadata:
      labels:
        app: k8s-dashboard-lite
    spec:
      serviceAccountName: k8s-dashboard-sa
      containers:
      - name: k8s-dashboard-lite
        image: ghcr.io/ninoslavmedan/k8s-dashboard-lite:v7.0.0
        ports:
        - containerPort: 8080
        resources:              # ← replace the empty `resources: {}` here
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"         # ← low ceiling so it's easy to saturate for the test
              memory: "128Mi"

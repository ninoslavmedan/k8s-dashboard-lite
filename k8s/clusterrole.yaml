apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-dashboard-role
rules:
- apiGroups: [""]
  resources:
    - pods
    - pods/log
    - services
    - namespaces
    - nodes
    - events
  verbs:
    - get
    - list
    - watch

- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs:
    - get
    - list
    - watch

# Metrics view (Nodes + Pod Metrics pages) - metrics-server API
- apiGroups: ["metrics.k8s.io"]
  resources:
    - pods
    - nodes
  verbs:
    - get
    - list
